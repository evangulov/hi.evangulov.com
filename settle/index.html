iv class=\"rl\"><span>Роль</span>Продакт-лид и дизайн-лид</div><a class=\"lk5 act\" href=\"https://settlewifi.com\" target=\"_blank\" rel=\"noopener\"><span>settlewifi.com</span><svg width=\".7em\" height=\".7em\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\"><path d=\"M7 17 17 7M8 7h9v9\"></path></svg></a></div></section><div class=\"band5 dark\"><div class=\"w5\"><div data-kid=\"1\" style=\"display: contents\"></div></div></div><section class=\"sec5\"><div class=\"w5\"><div class=\"sh5\"><div><div class=\"lb\">Главное решение</div><h2>Статус вместо мегабит</h2></div><p>Человеку в кафе не нужны цифры скорости. Ему важно, получится ли созвониться и загрузить файлы. Поэтому Settle отвечает одним словом, а цифры замера показывает по клику в «Подробнее».</p></div><div class=\"sq\"><div><h3><i style=\"--c: #2F55E4\"></i>Турбо</h3><p>Хватит даже для 4K и больших файлов.</p><ul><li class=\"ok\"><span>Сайты</span><span>да</span></li><li class=\"ok\"><span>Звонки</span><span>да</span></li><li class=\"ok\"><span>Файлы</span><span>да</span></li></ul></div><div><h3><i style=\"--c: #2F7BF6\"></i>Работай</h3><p>Можно созваниваться и работать в облаке. Большие файлы — дольше.</p><ul><li class=\"ok\"><span>Сайты</span><span>да</span></li><li class=\"ok\"><span>Звонки</span><span>да</span></li><li class=\"\"><span>Файлы</span><span>медленно</span></li></ul></div><div><h3><i style=\"--c: #EE8A12\"></i>Без созвонов</h3><p>Для сайтов и почты хватит. Для звонка лучше другая сеть.</p><ul><li class=\"ok\"><span>Сайты</span><span>да</span></li><li class=\"\"><span>Звонки</span><span>с перебоями</span></li><li class=\"\"><span>Файлы</span><span>медленно</span></li></ul></div><div><h3><i style=\"--c: #E5484D\"></i>Слабая сеть</h3><p>Попробуй раздать интернет с телефона.</p><ul><li class=\"\"><span>Сайты</span><span>медленно</span></li><li class=\"\"><span>Звонки</span><span>вряд ли</span></li><li class=\"\"><span>Файлы</span><span>вряд ли</span></li></ul></div></div></div></section><section class=\"sec5 dk5\"><div class=\"w5\"><div class=\"sh5\"><div><div class=\"lb\">Сложные случаи</div><h2>Когда сеть подводит</h2></div><p>Если связь стала нестабильной, Settle оставляет последнюю оценку и предлагает проверить снова. На раздаче с телефона скорость проверяется только по запросу — это до 5 МБ, чтобы не тратить трафик.</p></div></div><div class=\"band5 dark\"><div class=\"w5\"><div data-kid=\"2\" style=\"display: contents\"></div></div></div></section><section class=\"sec5\"><div class=\"w5\"><div class=\"sh5\"><div><div class=\"lb\">Запуск</div><h2>От идеи до приложения, которое можно скачать</h2></div><span></span></div><div class=\"c3x\"><div><div class=\"l\">Что я делал сам</div><p>Логику оценки, интерфейс, тексты и визуальное направление.</p></div><div><div class=\"l\">Как собрано</div><p>Код приложения и сайта написан с <span class=\"nw\">ИИ-инструментами</span>.</p></div><div><div class=\"l\">Как установить</div><p>Скачайте подписанный установщик на&nbsp;<a href=\"https://settlewifi.com\" target=\"_blank\" rel=\"noopener\">settlewifi.com</a>. Приложение обновляется автоматически и доступно на русском и английском.</p></div></div></div></section><section class=\"sec5\"><div class=\"w5\"><div class=\"sh5\"><div><span class=\"tag5\">Концепт</span><h2>Карта мест, где сети обычно хватает</h2></div><p>Проверки могли бы складываться в карту по дням и часам. Интерфейс спроектирован, в приложении его пока нет. Места и цифры на карте вымышлены.</p></div></div><div class=\"mapfull vd\" style=\"height: 900px\"><div class=\"in\" style=\"width: 1440px\"><div data-kid=\"3\" style=\"display: contents\"></div></div></div><div class=\"mapfull vm\" style=\"height: 844px\"><div class=\"in\" style=\"width: 390px\"><div data-kid=\"4\" style=\"display: contents\"></div></div></div><div></div></section><section class=\"w5 nx5\"><a href=\"/obeschali/\"><div class=\"t\">Следующий кейс</div><div class=\"b\"><span>Обеща
