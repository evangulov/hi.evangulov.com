/* type */

.kd-tr{display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;align-items:center;padding:10px 0;border-bottom:1px solid #DBDFE8}
.kd-tr:last-child{border-bottom:0}
.kd-tr .tm b{display:block;font-size:14px;font-weight:600}.kd-tr .tm span{font-size:12px;color:#5C6178;font-family:'Fira Mono',monospace}
.kd-tr .ts{font-weight:500;font-size:max(calc(var(--fs) * 1px * var(--k)), min(calc(var(--fs) * 1px), 15px));outline:none;border-radius:4px;transition:box-shadow .2s;min-width:0;overflow-wrap:anywhere}
.kd-tr .ts:hover{box-shadow:0 0 0 1px #DBDFE8,0 0 0 6px #fff,0 0 0 7px #DBDFE8}.kd-tr .ts:focus{box-shadow:0 0 0 2px #385CFF}
.kd-tr:nth-child(n+6) .ts{font-weight:400}
.kd-tr.mono{margin:0 -24px;padding:12px 24px;background:#0B1033;color:#fff;border-radius:0 0 8px 8px}.kd-tr.mono .tm span{color:#8FA6FF}
.kd-tr.mono .ts{font-family:'Fira Mono',monospace;font-weight:400;font-size:15px;color:#8FA6FF}
/* grid */
.kd-gt{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 16px;border-radius:8px;background:#fff;font-size:14px;font-weight:500;margin-bottom:12px;box-shadow:inset 0 0 0 1px #DBDFE8;transition:background .2s,color .2s}
.kd-gt::before{content:"";width:14px;height:14px;border-radius:4px;background:repeating-linear-gradient(90deg,#385CFF 0 2px,transparent 2px 4px)}
.kd-gt:hover{background:#E8EDFF}.kd-gt[aria-pressed="false"]::before{background:#DBDFE8}
.kd-grid{position:relative;background:#fff;border-radius:8px;padding:16px clamp(12px,4.2%,60px)}
.kd-grid .gc,.kd-grid .gb{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(4px,1.1%,16px)}
.kd-grid .gc{position:absolute;inset:0 clamp(12px,4.2%,60px);pointer-events:none;transition:opacity .4s}
.kd-grid .gc i{background:rgba(56,92,255,.08);font-style:normal;font-size:11px;color:#385CFF;font-family:'Fira Mono',monospace;padding-top:6px;text-align:center}
.kd-grid.off .gc{opacity:0}
.kd-grid .gb{position:relative;padding-top:24px;row-gap:12px}
.kd-grid .b{border-radius:8px;padding:12px;font-size:13px;font-weight:500;min-height:44px;box-sizing:border-box}
.kd-grid .h{grid-column:span 8;background:#0B1033;color:#fff;min-height:56px}.kd-grid .ld{grid-column:span 4;background:#385CFF;color:#fff}
.kd-grid .cd{grid-column:span 4;background:rgba(219,223,232,.8);color:#5C6178;min-height:48px}
.kd-tok{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:8px}
.kd-tok>div{background:#fff;border-radius:8px;padding:16px;position:relative;overflow:hidden}
.kd-tok b{display:block;font-weight:500;font-size:22px;letter-spacing:-.02em;margin-bottom:6px}
.kd-tok span{font-size:13px;line-height:1.4;color:#5C6178;display:block}
.kd-tok .rd i{position:absolute;right:14px;top:14px;width:22px;height:22px;border-top:2px solid #385CFF;border-right:2px solid #385CFF;border-top-right-radius:8px}
/* components */
.kds-cmp{--bg:#F3F5F9;--pn:#fff;--tx:#111426;--mu:#5C6178;--ln:#DBDFE8;margin-top:16px;transition:background .5s}
.kds-cmp[data-th="dark"]{--bg:#060A1C;--pn:#0B1033;--tx:#fff;--mu:rgba(255,255,255,.6);--ln:rgba(255,255,255,.12);background:#060A1C;margin-inline:calc(-1 * clamp(20px,3vw,48px));padding:24px clamp(20px,3vw,48px) clamp(20px,3vw,48px)}
.kc-top{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;margin-bottom:16px}
.kc-l{font-size:15px;color:var(--mu)}
.kc-sw{display:flex;gap:8px;flex-wrap:wrap}
.kd-seg{display:inline-flex;padding:4px;border-radius:8px;background:var(--pn,#fff);box-shadow:inset 0 0 0 1px var(--ln,#DBDFE8)}
.kd-seg button{all:unset;cursor:pointer;height:36px;padding:0 14px;border-radius:6px;font-size:14px;font-weight:500;color:var(--tx,#111426);display:inline-flex;align-items:center;transition:background .2s,color .2s}
.kd-seg button:hover{background:rgba(56,92,255,.08)}.kd-seg button.kd-on{background:#0B1033;color:#fff}
[data-th="dark"] .kd-seg button.kd-on{background:#fff;color:#0B1033}
.kc-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kc-p{background:var(--pn);border-radius:8px;padding:20px;color:var(--tx);transition:background .5s,color .5s;min-width:0}
.kc-p.w2,.kc-p.w3{grid-column:span 2}
.kc-h{font-size:14px;font-weight:600;margin-bottom:14px}.kc-h.s{margin-top:22px}
.kc-btn{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.kb{all:unset;cursor:pointer;box-sizing:border-box;height:48px;padding:0 20px;border-radius:8px;display:inline-flex;align-items:center;gap:12px;font-size:16px;font-weight:500;transition:background .25s,color .25s,gap .25s,box-shadow .25s}
.kb svg{width:18px;height:18px;transition:transform .25s}
.kb.pr{background:#385CFF;color:#fff}.kb.pr:hover,.fh .kb.pr{background:#2947EB;gap:18px}
.kb.dk{background:#0B1033;color:#fff}.kb.dk:hover,.fh .kb.dk{background:#385CFF;gap:18px}
.kb.gh{box-shadow:inset 0 0 0 1px #DBDFE8;color:#111426}.kb.gh:hover,.fh .kb.gh{background:#0B1033;color:#fff;box-shadow:none;gap:18px}
.kb.lt{background:#fff;color:#111426;box-shadow:inset 0 0 0 1px #DBDFE8}.kb.lt:hover,.fh .kb.lt{background:#E8EDFF;gap:18px}
[data-th="dark"] .kb.dk{background:#fff;color:#0B1033}[data-th="dark"] .kb.dk:hover,[data-th="dark"].fh .kb.dk{background:#E8EDFF}
[data-th="dark"] .kb.gh{box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);color:#fff}[data-th="dark"] .kb.gh:hover,[data-th="dark"].fh .kb.gh{background:#fff;color:#0B1033}
[data-th="dark"] .kb.lt{background:rgba(255,255,255,.1);color:#fff;box-shadow:none}[data-th="dark"] .kb.lt:hover,[data-th="dark"].fh .kb.lt{background:rgba(255,255,255,.18)}
.kb.wd{width:100%;justify-content:center;margin-top:12px}
.kd-tabs{display:inline-flex;flex-wrap:wrap;gap:4px}
.kt{all:unset;cursor:pointer;height:44px;padding:0 18px;border-radius:8px;font-size:15px;font-weight:500;color:var(--tx);display:inline-flex;align-items:center;transition:background .2s,color .2s}
.kt:hover,.fh .kt:not(.kd-on){background:rgba(56,92,255,.08)}.kt.kd-on{background:#0B1033;color:#fff}
[data-th="dark"] .kt.kd-on{background:#fff;color:#0B1033}[data-th="dark"] .kt:hover,[data-th="dark"].fh .kt:not(.kd-on){background:rgba(255,255,255,.12)}
.kd-tabs.sg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:4px;border-radius:8px;background:#0B1033;gap:0}
.kd-tabs.sg .kt{color:rgba(255,255,255,.85);height:40px;padding:0 6px;font-size:13px;justify-content:center;text-align:center}.kd-tabs.sg .kt:hover{background:rgba(255,255,255,.12)}.kd-tabs.sg .kt.kd-on{background:#fff;color:#0B1033}
[data-th="dark"] .kd-tabs.sg{background:rgba(255,255,255,.06)}
.kc-chips{display:flex;flex-wrap:wrap;gap:8px}
.kch{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:8px;font-size:14px;font-weight:500}
.kch.n{background:#F3F5F9;color:#111426}.kch.a{background:#E8EDFF;color:#385CFF}.kch.o{box-shadow:inset 0 0 0 1px var(--ln);color:var(--tx)}.kch.s{background:#0B1033;color:#fff}
[data-th="dark"] .kch.n{background:rgba(255,255,255,.08);color:#fff}[data-th="dark"] .kch.a{background:rgba(56,92,255,.25);color:#8FA6FF}[data-th="dark"] .kch.s{background:#fff;color:#0B1033}
.ktg{all:unset;cursor:pointer;height:44px;padding:0 16px;border-radius:8px;display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:500;background:rgba(17,20,38,.06);color:var(--tx);transition:background .2s,color .2s}
.ktg svg{width:16px;height:16px;display:none}.ktg.kd-on{background:#385CFF;color:#fff}.ktg.kd-on svg{display:block}
.ktg:hover,.fh .ktg:not(.kd-on){background:rgba(56,92,255,.14)}.ktg.kd-on:hover{background:#2947EB}
[data-th="dark"] .ktg{background:rgba(255,255,255,.1);color:rgba(255,255,255,.8)}[data-th="dark"] .ktg.kd-on{background:#385CFF;color:#fff}
.kc-bl{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.kc-bl li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:center;font-size:15px;line-height:1.4}
.kc-bl li svg{flex:none;width:22px;height:22px;padding:4px;box-sizing:border-box;border-radius:6px;background:#E8EDFF;color:#385CFF}
[data-th="dark"] .kc-bl li svg{background:rgba(56,92,255,.25);color:#8FA6FF}
.kin{display:block}
.kin .lb{display:block;font-size:13px;color:var(--mu);margin-bottom:8px}
.kin input{all:unset;box-sizing:border-box;width:100%;height:52px;padding:0 16px;border-radius:8px;background:#F3F5F9;color:#111426;font-size:16px;box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .2s,background .2s}
.kin input::placeholder{color:#8B90A3}
.kin input:hover,.fh .kin input{box-shadow:inset 0 0 0 1px #DBDFE8}.kin input:focus{background:#fff;box-shadow:inset 0 0 0 2px #385CFF}
[data-th="dark"] .kin input{background:rgba(255,255,255,.08);color:#fff}[data-th="dark"] .kin input:focus{background:rgba(255,255,255,.12)}
.kin .er{display:none;font-size:13px;color:#D93340;margin-top:6px}
.kin.bad input{box-shadow:inset 0 0 0 2px #D93340}.kin.bad .er{display:block}
.kcb{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;margin-top:14px;font-size:14px;line-height:1.4;color:var(--tx)}
.kcb i{flex:none;width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 1.5px #DBDFE8;display:grid;place-items:center;transition:background .2s,box-shadow .2s}
.kcb i svg{width:14px;height:14px;color:#fff;opacity:0}.kcb:hover i{box-shadow:inset 0 0 0 1.5px #385CFF}
.kcb[aria-pressed="true"] i{background:#385CFF;box-shadow:none}.kcb[aria-pressed="true"] i svg{opacity:1}
.kac{border-radius:8px;background:#F3F5F9;transition:background .2s}.kac+.kac{margin-top:8px}
[data-th="dark"] .kac{background:rgba(255,255,255,.06)}
.kac button{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px;font-size:16px;font-weight:500;letter-spacing:-.01em;color:var(--tx)}
.kac button i{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#0B1033;transition:transform .35s cubic-bezier(.16,1,.3,1),background .2s,color .2s}
.kac button i svg{width:18px;height:18px}
.kac:hover button i,.fh .kac button i{background:#E8EDFF;color:#385CFF}
.kac.kd-on button i{transform:rotate(45deg);background:#0B1033;color:#fff}
[data-th="dark"] .kac.kd-on button i{background:#fff;color:#0B1033}
.kac .aw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.16,1,.3,1)}
.kac.kd-on .aw{grid-template-rows:1fr}.kac .aw>p{overflow:hidden;margin:0;padding:0 18px;font-size:15px;line-height:1.5;color:var(--mu)}
.kac.kd-on .aw>p{padding-bottom:16px}
.kcard{display:flex;flex-direction:column;gap:8px;padding:20px;border-radius:8px;background:#F3F5F9;color:#111426;text-decoration:none;box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .25s,background .25s}
.kcard .k{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#385CFF}
.kcard .t{font-size:22px;font-weight:500;letter-spacing:-.025em}.kcard .d{font-size:15px;line-height:1.5;color:#5C6178}
.kcard .more{margin-top:8px;display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 14px;border-radius:8px;background:#fff;font-size:15px;font-weight:500;transition:background .25s,color .25s}
.kcard .more svg{width:16px;height:16px}
.kcard:hover,.fh .kcard{background:#fff;box-shadow:inset 0 0 0 1.5px #385CFF}.kcard:hover .more,.fh .kcard .more{background:#385CFF;color:#fff}
[data-th="dark"] .kcard{background:rgba(255,255,255,.06);color:#fff}[data-th="dark"] .kcard .d{color:rgba(255,255,255,.6)}[data-th="dark"] .kcard .more{background:rgba(255,255,255,.1)}
[data-th="dark"] .kcard:hover,[data-th="dark"].fh .kcard{background:#0B1033}
.kmr{display:flex;align-items:center;gap:14px;margin-top:8px;padding:0 16px;height:56px;border-radius:8px;background:#F3F5F9;color:#111426;text-decoration:none;font-size:15px;font-weight:500;transition:background .2s}
.kmr b{font-weight:500;color:#385CFF;font-size:13px;font-family:'Fira Mono',monospace}.kmr span{flex:1}.kmr svg{width:18px;height:18px;color:#385CFF;transition:transform .25s}
.kmr:hover,.fh .kmr{background:#E8EDFF}.kmr:hover svg,.fh .kmr svg{transform:translate(2px,-2px)}
[data-th="dark"] .kmr{background:rgba(255,255,255,.06);color:#fff}[data-th="dark"] .kmr:hover,[data-th="dark"].fh .kmr{background:rgba(56,92,255,.25)}

/* diagrams */
.kdd{margin-top:40px}
.kdd-tb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kdd-tb button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding-top:12px;border-top:2px solid #E2E2DE;transition:border-color .25s}
.kdd-tb b{font-weight:450;font-size:19px;color:#6E6E68;transition:color .2s}.kdd-tb span{font-size:15px;color:#8E8E86}
.kdd-tb button:hover b,.kdd-tb button.kd-on b{color:#121212}.kdd-tb button.kd-on{border-color:#121212}
.kdd-st{position:relative;background:radial-gradient(120% 90% at 85% 0%,#1B2A8C 0%,#0B1033 45%,#060A1C 100%);overflow:hidden}
.kdd-p{display:none;animation:kdFade .5s ease both}.kdd-p.kd-on{display:block}
@keyframes kdFade{from{opacity:0}to{opacity:1}}
.kdg-svg{display:block;width:100%;max-width:960px;margin:0 auto;height:auto;font-family:Onest,sans-serif}.kdg-svg.m{display:none}
.kdg-svg text{fill:#fff;font-size:17px;font-weight:500}
.kdg-svg .mo{font-family:'Fira Mono',monospace;font-size:14px;font-weight:400}
.kdg-svg .ac{fill:#8FA6FF}.kdg-svg .mt{fill:rgba(255,255,255,.55)}.kdg-svg .js{fill:rgba(255,255,255,.75)}
.kdg-svg .pn{fill:rgba(255,255,255,.04);stroke:rgba(255,255,255,.12)}
.kdg-svg .rw{fill:rgba(255,255,255,.05)}
.kdg-svg .dt{fill:#22D4ED;animation:kdBlink 2.4s ease-in-out infinite}
.kdg-svg .tr{fill:rgba(255,255,255,.12)}
.kdg-svg .br{fill:#8FA6FF;transform-box:fill-box;transform-origin:left center;animation:kdLoad 4s ease-in-out infinite alternate}
.kdg-svg .b1{animation-duration:3.2s;animation-delay:-1s}.kdg-svg .b2{animation-duration:5s;animation-delay:-2s}
@keyframes kdLoad{from{transform:scaleX(.25)}to{transform:scaleX(.85)}}
@keyframes kdBlink{50%{opacity:.35}}
.kdg-svg .st{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.16)}.kdg-svg .st.on{fill:#385CFF;stroke:none}
.kdg-svg .ln{stroke:rgba(143,166,255,.6);stroke-width:1.5;stroke-dasharray:4 5;fill:none}
.kdg-svg .mv{fill:#22D4ED}
.kdg-svg .lk{stroke:rgba(143,166,255,.55);stroke-width:1.5;stroke-dasharray:6 6;fill:none;animation:kdDash 1.6s linear infinite}
.kdg-svg .lk.fl{stroke:#22D4ED;stroke-width:2.5}
@keyframes kdDash{to{stroke-dashoffset:-24}}
.kdg-svg .tg{fill:#0B1033;stroke:rgba(143,166,255,.4)}
.kdg-svg .nd{cursor:pointer;outline:none}
.kdg-svg .nd .bx{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.16);transition:fill .3s,stroke .3s}
.kdg-svg .nd:hover .bx,.kdg-svg .nd:focus-visible .bx{stroke:#8FA6FF}
.kdg-svg .nd.w .bx{fill:rgba(56,92,255,.35);stroke:#385CFF}.kdg-svg .nd.s .bx{stroke:#22D4ED}
.kdg-svg .nd .bd{fill:rgba(56,92,255,.25)}
.kdg-svg .ed{fill:none;stroke:rgba(255,255,255,.25);stroke-width:1.5;transition:stroke .3s}
.kdg-svg .ed.on,.kdg-svg .ed.e1{stroke:#8FA6FF;stroke-width:2}
.kdg-svg .bn rect{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.16);transition:fill .3s,stroke .3s}
.kdg-svg .bn.on rect{fill:#385CFF;stroke:none}.kdg-svg .bn.n0 rect{fill:#fff}.kdg-svg .bn.n0 text{fill:#0B1033}
.kdg-svg .dm{cursor:pointer;outline:none}.kdg-svg .dm path{fill:#0B1033;stroke:#8FA6FF;stroke-width:1.5;transition:fill .2s}
.kdg-svg .dm:hover path,.kdg-svg .dm:focus-visible path{fill:#1B2A8C}
.kdg-svg .yl,.kdg-svg .nl{fill:rgba(255,255,255,.4);transition:fill .3s}.kdg-svg .yl.on,.kdg-svg .nl.on{fill:#22D4ED}

/* calculator */
.kdd-p .kcalc{margin:0}.kcalc{margin-top:16px;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;padding:16px;background:#060A1C;font-family:Onest,sans-serif;position:relative;overflow:hidden}
.kcalc::before{content:"";position:absolute;left:-10%;top:-30%;width:60%;height:90%;background:radial-gradient(closest-side,rgba(125,92,255,.45),rgba(232,90,140,.18) 55%,transparent);pointer-events:none}
.kcl{position:relative;padding:clamp(16px,3vw,40px);color:#fff}
.kch2{font-size:clamp(28px,3vw,44px);font-weight:500;letter-spacing:-.035em;line-height:1.05;margin-bottom:28px}
.kcl .lab{font-size:15px;color:rgba(255,255,255,.7);margin:22px 0 10px}
.kq2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kq{display:flex;align-items:center;justify-content:space-between;height:56px;padding:4px;border-radius:8px;background:rgba(255,255,255,.06);box-sizing:border-box}
.kq button{all:unset;cursor:pointer;width:44px;height:48px;border-radius:6px;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff;transition:background .2s}
.kq button:hover{background:rgba(255,255,255,.2)}.kq button svg{width:16px;height:16px}
.kq .v{display:flex;align-items:baseline;gap:6px}.kq .v b{font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}.kq .v em{font-style:normal;font-size:13px;color:rgba(255,255,255,.6)}
.kq.off{opacity:.35;pointer-events:none}
.kd-seg.dk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:rgba(255,255,255,.06);box-shadow:none;width:100%;box-sizing:border-box}
.kd-seg.dk button{color:rgba(255,255,255,.85);justify-content:center;height:44px}.kd-seg.dk button:hover{background:rgba(255,255,255,.12)}
.kd-seg.dk button.kd-on{background:#fff;color:#0B1033}
.krg .tr{position:relative;height:28px;margin-top:4px;touch-action:none}
.krg .tr::before{content:"";position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
.krg .fl{position:absolute;left:0;top:12px;height:4px;width:var(--v);border-radius:2px;background:#385CFF}
.krg .th{position:absolute;top:4px;left:var(--v);width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(56,92,255,.35);transition:transform .15s;pointer-events:none}
.krg .tr:hover .th,.krg .tr:active .th{transform:scale(1.15)}
.krg input{position:absolute;inset:-6px -10px;width:calc(100% + 20px);height:40px;margin:0;opacity:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.krg .rl{display:flex;justify-content:space-between;font-size:13px;color:rgba(255,255,255,.5);margin-top:6px}.krg .cv{color:#fff}
.kcr{position:relative;background:#fff;border-radius:8px;padding:clamp(20px,2.4vw,32px);display:flex;flex-direction:column;color:#111426}
.kcr .h{font-size:15px;font-weight:500;color:#385CFF;margin-bottom:10px}
