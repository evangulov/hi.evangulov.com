th=\".7em\" height=\".7em\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\"><path d=\"M7 17 17 7M8 7h9v9\"></path></svg></a></div></section><div class=\"eqh\"><img src=\"/assets/9487b6533b05.jpg\" alt=\"Измерительный комплекс «Эквивалент» на подиуме\"></div><section class=\"sec5\"><div class=\"wrap\"><div class=\"sh5\"><div><div class=\"lb\">Идея</div><h2>От инженерного прототипа к продукту на рынке</h2></div><p>У заказчика были инженерный прототип и черновое описание прибора. Для выхода на рынок ему понадобились собственный стиль и материалы, которые объясняют, как он работает. Стиль материнской компании использовать было нельзя.</p></div><div class=\"eqcap\"><span><b>Было</b> · 3D-модель прототипа</span></div><div class=\"eqm\"><video src=\"/assets/93a824959490.mp4\" poster=\"/assets/35cefca4d62b.jpg\" autoplay muted loop playsinline aria-label=\"3D-модель прототипа, вращение\"></video></div></div></section><section class=\"sec5 dk5 in6\"><div class=\"band5 dark\"><div class=\"wrap\"><div class=\"sh5\"><div><div class=\"lb\">Задача</div><h2>Стиль, визуализации и сайт к запуску</h2></div><p>Подготовить всё, с чем прибор выходит на рынок: собственный стиль, продуктовые изображения, сайт и презентацию.</p></div><div class=\"c3x ic9\"><div><i><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\" stroke-linecap=\"round\" stroke-linejoin=\"round\" ><path d=\"M15.707 21.293a1 1 0 0 1-1.414 0l-1.586-1.586a1 1 0 0 1 0-1.414l5.586-5.586a1 1 0 0 1 1.414 0l1.586 1.586a1 1 0 0 1 0 1.414z\"/><path d=\"m18 13-1.375-6.874a1 1 0 0 0-.746-.776L3.235 2.028a1 1 0 0 0-1.207 1.207L5.35 15.879a1 1 0 0 0 .776.746L13 18\"/><path d=\"m2.3 2.3 7.286 7.286\"/><circle cx=\"11\" cy=\"11\" r=\"2\"/></svg></i><div class=\"l\">Айдентика</div><p>Собственный знак и стиль — отдельно от материнской компании.</p></div><div><i><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\" stroke-linecap=\"round\" stroke-linejoin=\"round\" ><path d=\"M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z\"/><path d=\"m3.3 7 8.7 5 8.7-5\"/><path d=\"M12 22V12\"/></svg></i><div class=\"l\">3D-визуализации</div><p>Из инженерных <span class=\"nw\">CAD-файлов</span> — изображения, по которым видно, как устроен прибор.</p></div><div><i><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\" stroke-linecap=\"round\" stroke-linejoin=\"round\" ><path d=\"m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z\"/><path d=\"m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65\"/><path d=\"m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65\"/></svg></i><div class=\"l\">Сайт и презентация</div><p>Материалы для продаж с характеристиками, которые нужно было собрать у инженеров.</p></div></div></div></div></section><section class=\"sec5\"><div class=\"wrap\"><div class=\"sh5\"><div><div class=\"lb\">Что я сделал</div><h2>Провёл прибор от модели до выпуска</h2></div><span></span></div><div class=\"pr5 w2\"><div><div class=\"n\">01</div><h3>Данные и визуализации</h3></div><p>Подобрал подрядчиков под каждую задачу. Собрал у инженеров характеристики прибора, подготовил ТЗ для 3D‑визуализатора и вёл работу над рендерами до чистого продуктового вида.</p></div><div class=\"eqcap eqcmp\"><span><b>Модель → рендер</b> · один ракурс, потяните ползунок, чтобы сравнить</span></div><div class=\"eqc9\" style=\"--p: 50%\"><img src=\"/assets/bab1b095fea1.jpg\" alt=\"Финальный 3D-рендер «Эквивалента» с банкой на сетке\" loading=\"lazy\"><div class=\"b4\"><img src=\"/assets/9fe9bc98f3a2.jpg\" alt=\"Исходная инженерная модель прибора в том же ракурсе\" loading=\"lazy\"></div><span class=\"tg l\">Исходная модель</span><span class=\"tg r\">Финальный рендер</span><span class=\"hd\" aria-hidden=\"true\"><i><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M9 6 3 12l6 6M15 6l6 6-6 6\"></path></svg></i></span><input type=\"range\" min=\"0\" max=\"100\" value=\"50\" aria-label=\"Сравнить исходную модель и финальный рендер\"></div><div class=\"pr5 w2\"><div><div class=\"n\">02</div><h3>Как прибор выглядит в работе</h3></div><p>Финальные 3D-рендеры показывают прибор с разных сторон. На ракурсе с банкой видно, как она устанавливается под блоком датчиков. Вид сверху помогает рассмотреть расположение узлов и панель управления.</p></div><div class=\"eqa\"><div class=\"st\"><img class=\"on\" src=\"/assets/bab1b095fea1.jpg\" alt=\"«Эквивалент»: в работе\"><img class=\"\" src=\"/assets/9487b6533b05.jpg\" alt=\"«Эквивалент»: общий вид\"><img class=\"\" src=\"/assets/ae8d70061271.jpg\" alt=\"«Эквивалент»: вид сверху\"></div><div class=\"tb\"><button type=\"button\" class=\"on\" aria-pressed=\"true\"><img src=\"/assets/2cf84f2db92a.jpg\" alt=\"\" loading=\"lazy\"><span>В работе<i></i></span></button><button type=\"button\" class=\"\" aria-pressed=\"false\"><img src=\"/assets/9dc7373defab.jpg\" alt=\"\" loading=\"lazy\"><span>Общий вид<i></i></span></button><button type=\"button\" class=\"\" aria-pressed=\"false\"><img src=\"/assets/04348608070f.jpg\" alt=\"\" loading=\"lazy\"><span>Вид сверху<i></i></span></button></div></div></div></section><section class=\"eqzb\"><div class=\"wrap\"><div class=\"eqzh\"><h3>Крупные планы</h3><p>Ключевые узлы прибора вблизи — фрагменты финальных рендеров в исходном 8K-разрешении.</p></div><div class=\"eqz\"><figure class=\"big\"><img src=\"/assets/9a599ef12126.jpg\" alt=\"Блок датчиков\" loading=\"lazy\"><figcaption><b>01</b>Блок датчиков</figcaption></figure><div class=\"sd\"><figure class=\"\"><img src=\"/assets/788ceaf0bbe8.jpg\" alt=\"Панель с экраном\" loading=\"lazy\"><figcaption><b>02</b>Панель с экраном</figcaption></figure><figure class=\"\"><img src=\"/assets/d70af7943819.jpg\" alt=\"Чаша под банку\" loading=\"lazy\"><figcaption><b>03</b>Чаша под банку</figcaption></figure></div></div></div></section><section class=\"sec5 eqtail\"><div class=\"wrap\"><div class=\"pr5 w2\"><div><div class=\"n\">03</div><h3>Айдентика, сайт и презентация</h3></div><p>Вёл разработку логотипа и стиля «Эквивалент» до логобука. Собрал и запустил лендинг, подготовил презентацию для продаж.</p></div></div></section><section class=\"sec5\"><div class=\"wrap\"><div class=\"sh5\"><div><div class=\"lb\">Что получилось</div><h2>С чем прибор вышел на рынок</h2></div><p>К запуску у «Эквивалента» появились собственная айдентика и логобук, продуктовые 3D-рендеры, лендинг и презентация для продаж.</p></div></div><div class=\"eqst\"><div class=\"wrap\"><div class=\"eqcap\"><span><b>Логотип</b></span><button type=\"button\" class=\"rp\" aria-label=\"Собрать логотип ещё раз\">Собрать ещё раз</button></div></div><div class=\"lgw\"><svg class=\"eqlogo\" role=\"img\" aria-label=\"Логотип Эквивалент\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" version=\"1.1\" viewBox=\"0 0 2066 746\"><defs><style>\n      .st0 {\n        fill: url(#linear-gradient2);\n      }\n\n      .st1 {\n        fill: url(#linear-gradient1);\n      }\n\n      .st2 {\n        fill: url(#linear-gradient3);\n      }\n\n      .st3 {\n        fill: url(#linear-gradient);\n      }\n\n      .st4 {\n        isolation: isolate;\n      }\n    </style><linearGradient id=\"linear-gradient\" x1=\"492.9\" y1=\"477\" x2=\"227.4\" y2=\"258.9\" gradientTransform=\"translate(-.5 748.3) rotate(0) scale(1 -1)\" gradientUnits=\"userSpaceOnUse\"><stop offset=\".3\" stop-color=\"#1dc2ff\"/><stop offset=\"1\" stop-color=\"#fff\" stop-opacity=\"0\"/></linearGradient><linearGradient id=\"linear-gradient1\" x1=\"378.6\" y1=\"625.4\" x2=\"368.6\" y2=\"266.2\" gradientTransform=\"translate(-5.9 -.2) rotate(90) scale(1 -1)\" gradientUnits=\"userSpaceOnUse\"><stop offset=\".3\" stop-color=\"#002cf0\"/><stop offset=\
