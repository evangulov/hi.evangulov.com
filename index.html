.s5 .hd5 nav a:hover,.s5 .hd5 nav a:focus-visible,.s5 .hd5 .nm:hover,.s5 .hd5 .nm:focus-visible{background:#C7F36B!important;color:#121212!important;outline:none}

.gf-cl a .t{white-space:nowrap;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.gf-cl a svg{flex:none;width:.72em;height:.72em;stroke-width:1.8;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.gf-cl a:hover .t,.gf-cl a:focus-visible .t{background:#C7F36B;color:#121212}

.pv-g{--ink:#121212;--mut:#6E6E68;--ln:#DCDCD6;--ns:clamp(32px,3.8vw,58px)}
/* home: while the big name is on screen the header shows only the menu; the compact name fades in once it has gone */
.pv-g .hd5 .nm{transition:opacity .35s ease,transform .35s cubic-bezier(.16,1,.3,1),visibility 0s}
.pv-g .hd5.nm-auto:not(.nm-on) .nm{opacity:0;transform:translateY(6px);visibility:hidden;pointer-events:none;transition:opacity .25s ease,transform .25s ease,visibility 0s .25s}
/* greeting: copy, muted */
.pv-g .pp-k{font-size:clamp(17px,1.4vw,21px);line-height:1.4;letter-spacing:-.01em;font-weight:400;color:var(--mut);margin-bottom:clamp(4px,.5vw,8px)}
/* display: size does the work, the weight stays regular */
.pv-g .pp-name{font-weight:400;letter-spacing:-.06em;line-height:.9}
/* intro: the lead and the experience, both regular */
.pv-g .pp-hero{padding-bottom:clamp(48px,5vw,72px)}
.pv-g .pv-about{border-top-color:var(--ln);gap:clamp(24px,3vw,48px);margin-top:clamp(28px,3vw,48px);padding-top:clamp(20px,2vw,28px)}
.pv-g .pv-about .l{font-size:clamp(28px,2.7vw,42px);line-height:1.12;letter-spacing:-.035em;font-weight:400;max-width:9.4em}
.pv-g .pv-about .rr{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(20px,2vw,28px)}
.pv-g .pv-about .r{font-size:clamp(17px,1.4vw,21px);line-height:1.45;letter-spacing:-.01em;font-weight:400;color:#3A3A36;max-width:30em}
.pv-g .tl{display:inline-flex;align-items:center;gap:6px;color:var(--ink);outline:none;font-size:16px;line-height:1.35;letter-spacing:-.005em;font-weight:400}
.pv-g .tl .t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.24em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.pv-g .tl svg{flex:none;width:18px;height:18px;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.pv-g .tl:hover .t,.pv-g .tl:focus-visible .t{background:var(--lime)}
.pv-g .tl:hover svg,.pv-g .tl:focus-visible svg{transform:translateX(4px)}
/* section head: the title (36, 500) and a small regular link and, a step to its right, the way into the matching tab of «Обо мне» */
.pv-g .pv-sh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:flex-start;gap:8px clamp(24px,2.6vw,40px);margin:0 0 clamp(14px,1.4vw,20px)}
.pv-g .pv-st{font-size:clamp(26px,2.4vw,36px);line-height:1.1;letter-spacing:-.035em;font-weight:500;margin:0}
/* catalog: case names 500, descriptions copy-18 400, quiet rules, ink arrows */
.pv-g .vr{border-bottom-color:var(--ln);padding:clamp(12px,1.1vw,18px) 0}
.pv-g .vr:first-of-type{border-top:1px solid var(--ln)}
.pv-g .vr-n{font-weight:400;letter-spacing:-.045em;line-height:1.02}
.pv-g .vr-d{font-size:clamp(16px,1.25vw,18px);line-height:1.45;letter-spacing:-.005em;font-weight:400;color:#4A4A45}
.pv-g .vr-x{width:22px;height:22px;color:var(--ink)}
.pv-g .pp-tr{padding-bottom:clamp(56px,5.6vw,88px)}
.pv-g #brands{padding-bottom:clamp(56px,5.6vw,88px)}
@media(max-width:760px){
 .pv-g{--ns:clamp(26px,7.4vw,30px)}
 .pv-g .pv-about{gap:20px}.pv-g .pv-about .l{font-size:28px}.pv-g .pv-about .r{font-size:17px}.pv-g .pp-hero{padding-bottom:40px}
 .pv-g .pv-sh{flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:12px}.pv-g .pv-st{font-size:26px}.pv-g .tl{font-size:15px}
 /* phone: one rule over each group, rows separated by air */
 .pv-g .vr{border-bottom:0;padding:12px 0 14px}.pv-g .vr:first-of-type{padding-top:16px}
 .pv-g .vr-d{font-size:15px;color:#55554F}.pv-g .pp-tr{padding-bottom:48px}.pv-g #brands{padding-bottom:48px}
}

/* Geist: the portfolio's own text */
.s5{font-family:Geist,'Helvetica Neue',Helvetica,Arial,sans-serif;font-optical-sizing:auto}
.pp{--disp:Geist,'Helvetica Neue',Helvetica,Arial,sans-serif}
/* the Settle demo styles leak a global .d onto the page: the case lead takes Geist back */
.s5 .ch5 .d{font-family:Geist,'Helvetica Neue',Helvetica,Arial,sans-serif}
.s5 .dz,.s5 .obchat,.s5 .kc3,.s5 .kc2-us,.s5 .kcs,.s5 .kv2,.s5 .st7 .sc7{font-family:Onest,'Helvetica Neue',Helvetica,sans-serif}
/* the switch: three square segments, as in a shop; the list stays the default */
.cv-bw{display:flex;justify-content:flex-end;padding-top:clamp(28px,3vw,40px);padding-bottom:8px}
.cv-sw{display:inline-flex;border:1px solid var(--ink)}
.cv-sw button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;font-size:15px;letter-spacing:-.005em;color:var(--ink)}
.cv-sw button+button{border-left:1px solid var(--ink)}
.cv-sw svg{width:18px;height:18px}
.cv-sw button:hover{background:#C7F36B}
.cv-sw button[aria-checked="true"]{background:var(--ink);color:#F5F5F3}
.cv-sw button:focus-visible{outline:2px solid #C7F36B;outline-offset:2px}
.pv-dk #products{padding-top:0!important}
#work[data-view="list"] .cv-grid,#work[data-view="list"] .cv-big,#work[data-view="grid"] .cv-list,#work[data-view="grid"] .cv-big,
#work[data-view="big"] .cv-list,#work[data-view="big"] .cv-grid{display:none}

/* the tile is the name and its line, nothing else.
   Type is measured against the tile itself (container units): 11.5cqw keeps «Интернет‑магазин» on one line in any tile,
   so every name keeps its full text; short names simply leave more black around them. */
.cv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.2vw,20px);border-top:1px solid var(--ln);padding-top:clamp(16px,1.6vw,24px)}
.cvt{container-type:inline-size;display:flex;flex-direction:column;justify-content:space-between;gap:16px;aspect-ratio:4/3;box-sizing:border-box;
 padding:clamp(18px,1.7vw,26px);background:#121212;color:#F5F5F3!important;outline:none;transition:background-color .25s,color .25s}
.cvt .tn{font-size:11.5cqw;line-height:.98;letter-spacing:-.045em;font-weight:400;text-wrap:balance}
.cvt .tb{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.cvt .td{font-size:max(14px,4.3cqw);line-height:1.3;letter-spacing:-.01em;color:#A3A39C;max-width:26ch;transition:color .25s}
.cvt .tx{flex:none;width:max(20px,6cqw);height:max(20px,6cqw);transition:transform .3s cubic-bezier(.16,1,.3,1)}.cvt .tx svg{width:100%;height:100%;display:block}
.cvt:hover,.cvt:focus-visible{background:#C7F36B;color:#121212!important}
.cvt:hover .td,.cvt:focus-visible .td{color:#3A3A36}
.cvt:hover .tx,.cvt:focus-visible .tx{transform:translateX(4px)}

/* large: the same tile across the full width, one case at a time */
.cv-big{border-top:1px solid var(--ln);padding-top:clamp(16px,1.6vw,24px)}
.cs{display:none}.cs.on{display:block;animation:csIn .5s cubic-bezier(.16,1,.3,1)}
@keyframes csIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.cvt-big{aspect-ratio:auto;min-height:min(640px,64vh);padding:clamp(24px,3.4vw,48px)}
.cvt-big .td{font-size:max(16px,2.4cqw);max-width:30ch}
.cvt-big .tx{width:max(28px,4cqw);height:max(28px,4cqw)}
.cs-nav{display:flex;align-items:center;gap:12px;margin-top:16px}
.cs-nav button{all:unset;cursor:pointer;display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--ink)}
.cs-nav button svg{width:20px;height:20px}.cs-nav button:hover,.cs-nav button:focus-visible{background:#C7F36B}
.cs-c{font-size:15px;color:#55554F;font-variant-numeric:tabular-nums;min-width:44px;text-align:center}.cs-c b{font-weight:400;color:var(--ink)}

/* the change of view: blocks glide and resize into their new place, names and lines follow, the rest of the page holds still */
.cv-vt::view-transition-group(*){animation-duration:.6s;animation-timing-function:cubic-bezier(.77,0,.18,1)}
.cv-vt::view-transition-old(root),.cv-vt::view-transition-new(root){animation:none}
.cv-vt::view-transition-old(*){animation:cvOut .25s ease both;height:100%;object-fit:none;object-position:left top}
